[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "monarch-access"
dynamic = ["version"]
description = "Lightweight CLI and Python SDK for accessing Monarch Money financial data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
    "click>=8.0.0",
    "tinydb>=4.8.0",
    "mcp-app @ git+https://github.com/echomodel/mcp-app.git@v0.11.0",
    "mcp<2",  # mcp-app v0.11.0 uses the v1 FastMCP API and does not cap mcp
    "pydantic>=2.0.0",
    "cryptography>=42",  # decrypts Chrome's cookie store (monarch-admin acquire-session)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]
http = [
    "uvicorn>=0.30.0",
]

[project.scripts]
monarch = "monarch.cli:cli"
monarch-mcp = "monarch:app.mcp_cli"
monarch-admin = "monarch:app.admin_cli"

[project.entry-points."mcp_app.apps"]
monarch = "monarch:app"

[project.urls]
Homepage = "https://github.com/echomodel/monarch-access"
Repository = "https://github.com/echomodel/monarch-access"

[tool.setuptools_scm]
# The version comes from the latest vX.Y.Z git tag. Builds from a `git archive`
# snapshot (the cloud deploy) read it from .git_archival.txt; the fallback only
# applies when neither git metadata nor the archival file is available.
fallback_version = "0.0.0+unknown"

[tool.setuptools.packages.find]
include = ["monarch*"]

[tool.pytest.ini_options]
# Only run unit and framework tests by default. Integration tests require live credentials.
# Run integration tests with: pytest tests/integration/ -v
testpaths = ["tests"]
addopts = "--ignore=tests/integration"
asyncio_mode = "auto"
